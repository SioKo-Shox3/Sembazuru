name: Session 0 ステーション権限・起動フラグ診断

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  session0:
    name: Session 0 診断 (station mask ${{ matrix.station-mask }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        station-mask: ['0x0002', '0x0022']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Session 0 のステーション権限と CREATE_NO_WINDOW を測定する
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
        env:
          SBZ_DIAGNOSTIC_STATION_MASK: ${{ matrix.station-mask }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $env:PSModulePath = "$PSHOME\Modules"
          $principal = [Security.Principal.WindowsPrincipal]::new(
              [Security.Principal.WindowsIdentity]::GetCurrent()
          )
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
              throw '診断には昇格済みの runner が必要です。'
          }
          $checkoutSha = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $checkoutSha -cne $env:GITHUB_SHA) {
              throw 'checkout と診断対象のコミット SHA が一致しません。'
          }
          Write-Host ('commit={0} runner_os={1} os_build={2} requested_station_mask={3} run_id={4} run_attempt={5}' -f
              $env:GITHUB_SHA, $env:RUNNER_OS, [Environment]::OSVersion.Version,
              $env:SBZ_DIAGNOSTIC_STATION_MASK, $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          $probePath = [IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE 'hooks/test/m6_worker_window_station_probe.ps1')
          )
          $expectedProbeSha256 = (Get-FileHash -LiteralPath $probePath -Algorithm SHA256).Hash
          $initBuildPath = [IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE 'hooks/test/session0_init_probe.ps1')
          )
          $initSourcePath = [IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE 'hooks/test/session0_init_probe.cpp')
          )
          $initProbePath = [IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE '.harness/T-011-init-probe/session0_init_probe.exe')
          )
          $expectedInitBuildSha256 = (Get-FileHash -LiteralPath $initBuildPath -Algorithm SHA256).Hash
          $expectedInitSourceSha256 = (Get-FileHash -LiteralPath $initSourcePath -Algorithm SHA256).Hash
          $entryBuildPath = [IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE 'hooks/test/session0_entry_probe.ps1')
          )
          $entrySourcePath = [IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE 'hooks/test/session0_entry_probe.cpp')
          )
          $entryProbePath = [IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE '.harness/T-011-entry-probe/session0_entry_probe.exe')
          )
          $expectedEntryBuildSha256 = (Get-FileHash -LiteralPath $entryBuildPath -Algorithm SHA256).Hash
          $expectedEntrySourceSha256 = (Get-FileHash -LiteralPath $entrySourcePath -Algorithm SHA256).Hash
          $terminateBuildPath = [IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE 'hooks/test/session0_terminate_probe.ps1')
          )
          $terminateSourcePath = [IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE 'hooks/test/session0_terminate_probe.cpp')
          )
          $terminateProbePath = [IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE '.harness/T-011-terminate-probe/session0_terminate_probe.exe')
          )
          $expectedTerminateBuildSha256 = (Get-FileHash -LiteralPath $terminateBuildPath -Algorithm SHA256).Hash
          $expectedTerminateSourceSha256 = (Get-FileHash -LiteralPath $terminateSourcePath -Algorithm SHA256).Hash
          $subsystemBuildPath = [IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE 'hooks/test/session0_subsystem_probe.ps1')
          )
          $consoleProbePath = [IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE '.harness/T-011-subsystem-probe/console/session0_subsystem_probe.exe')
          )
          $windowsProbePath = [IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE '.harness/T-011-subsystem-probe/windows/session0_subsystem_probe.exe')
          )
          $expectedSubsystemBuildSha256 = (Get-FileHash -LiteralPath $subsystemBuildPath -Algorithm SHA256).Hash
          $windowsInitBuildPath = [IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE 'hooks/test/session0_windows_init_probe.ps1')
          )
          $windowsInitProbePath = [IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE '.harness/T-011-windows-init-probe/session0_windows_init_probe.exe')
          )
          $expectedWindowsInitBuildSha256 = (Get-FileHash -LiteralPath $windowsInitBuildPath -Algorithm SHA256).Hash
          $windowsStartupBuildPath = [IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE 'hooks/test/session0_windows_startup_probe.ps1')
          )
          $windowsStartupSourcePath = [IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE 'hooks/test/session0_windows_startup_probe.cpp')
          )
          $windowsStartupProbePath = [IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE '.harness/T-011-windows-startup-probe/session0_windows_startup_probe.exe')
          )
          $expectedWindowsStartupBuildSha256 = (Get-FileHash -LiteralPath $windowsStartupBuildPath -Algorithm SHA256).Hash
          $expectedWindowsStartupSourceSha256 = (Get-FileHash -LiteralPath $windowsStartupSourcePath -Algorithm SHA256).Hash
          $gdi32InitBuildPath = [IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE 'hooks/test/session0_gdi32_init_probe.ps1')
          )
          $gdi32InitSourcePath = [IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE 'hooks/test/session0_gdi32_init_probe.cpp')
          )
          $gdi32InitProbePath = [IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE '.harness/T-011-N30-gdi32-init-probe/session0_gdi32_init_probe.exe')
          )
          $expectedGdi32InitBuildSha256 = (Get-FileHash -LiteralPath $gdi32InitBuildPath -Algorithm SHA256).Hash
          $expectedGdi32InitSourceSha256 = (Get-FileHash -LiteralPath $gdi32InitSourcePath -Algorithm SHA256).Hash
          $win32uInitBuildPath = [IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE 'hooks/test/session0_win32u_init_probe.ps1')
          )
          $win32uInitSourcePath = [IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE 'hooks/test/session0_win32u_init_probe.cpp')
          )
          $win32uInitProbePath = [IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE '.harness/T-011-N35-win32u-init-probe/session0_win32u_init_probe.exe')
          )
          $expectedWin32uInitBuildSha256 = (Get-FileHash -LiteralPath $win32uInitBuildPath -Algorithm SHA256).Hash
          $expectedWin32uInitSourceSha256 = (Get-FileHash -LiteralPath $win32uInitSourcePath -Algorithm SHA256).Hash
          $win32uUser32BuildPath = [IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE 'hooks/test/session0_win32u_user32_probe.ps1')
          )
          $win32uUser32SourcePath = [IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE 'hooks/test/session0_win32u_user32_probe.cpp')
          )
          $win32uUser32ProbePath = [IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE '.harness/T-011-N40-win32u-user32-probe/session0_win32u_user32_probe.exe')
          )
          $expectedWin32uUser32BuildSha256 = (Get-FileHash -LiteralPath $win32uUser32BuildPath -Algorithm SHA256).Hash
          $expectedWin32uUser32SourceSha256 = (Get-FileHash -LiteralPath $win32uUser32SourcePath -Algorithm SHA256).Hash
          $user32ResourceBuildPath = [IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE 'hooks/test/session0_user32_resource_probe.ps1')
          )
          $user32ResourceSourcePath = [IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE 'hooks/test/session0_user32_resource_probe.cpp')
          )
          $user32ResourceProbePath = [IO.Path]::GetFullPath(
              (Join-Path $env:GITHUB_WORKSPACE '.harness/T-011-N45-user32-resource-probe/session0_user32_resource_probe.exe')
          )
          $expectedUser32ResourceBuildSha256 = (Get-FileHash -LiteralPath $user32ResourceBuildPath -Algorithm SHA256).Hash
          $expectedUser32ResourceSourceSha256 = (Get-FileHash -LiteralPath $user32ResourceSourcePath -Algorithm SHA256).Hash
          & rustup toolchain install 1.97.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain の導入に失敗しました。' }
          $artifacts = @(& cargo +1.97.0 test -p sembazuru-worker --lib --locked --no-run --message-format=json)
          if ($LASTEXITCODE -ne 0) { throw 'worker 診断 fixture のビルドに失敗しました。' }
          $executables = @($artifacts | ForEach-Object {
              $artifact = $_ | ConvertFrom-Json
              if ($artifact.reason -eq 'compiler-artifact' -and $artifact.profile.test -eq $true -and
                  $artifact.target.name -eq 'sembazuru_worker' -and
                  $artifact.target.kind.Count -eq 1 -and $artifact.target.kind[0] -eq 'lib' -and
                  $null -ne $artifact.executable) {
                  $artifact.executable
              }
          })
          if ($executables.Count -ne 1) { throw 'worker ライブラリのテスト EXE は1個だけ必要です。' }
          $artifactPath = [IO.Path]::GetFullPath($executables[0])
          $expectedArtifactSha256 = (Get-FileHash -LiteralPath $artifactPath -Algorithm SHA256).Hash
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class Session0BootstrapNative {
              [StructLayout(LayoutKind.Sequential)]
              public struct FileInformation {
                  public uint Attributes;
                  public System.Runtime.InteropServices.ComTypes.FILETIME CreationTime;
                  public System.Runtime.InteropServices.ComTypes.FILETIME LastAccessTime;
                  public System.Runtime.InteropServices.ComTypes.FILETIME LastWriteTime;
                  public uint VolumeSerialNumber;
                  public uint FileSizeHigh;
                  public uint FileSizeLow;
                  public uint LinkCount;
                  public uint FileIndexHigh;
                  public uint FileIndexLow;
              }
              [DllImport("kernel32.dll", SetLastError = true)]
              [return: MarshalAs(UnmanagedType.Bool)]
              public static extern bool GetFileInformationByHandle(
                  IntPtr handle, out FileInformation information);
              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              public static extern uint GetFinalPathNameByHandleW(
                  IntPtr handle, StringBuilder path, uint length, uint flags);
          }
          '@
          function Open-VerifiedInput([string]$Path, [string]$ExpectedSha256) {
              $stream = [IO.FileStream]::new(
                  $Path, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::Read
              )
              try {
                  $information = [Session0BootstrapNative+FileInformation]::new()
                  if (-not [Session0BootstrapNative]::GetFileInformationByHandle(
                      $stream.SafeFileHandle.DangerousGetHandle(), [ref]$information
                  )) { throw '診断入力の実体情報を取得できません。' }
                  if (($information.Attributes -band [uint32]0x410) -ne 0 -or $information.LinkCount -ne 1) {
                      throw '診断入力には通常の非reparse単一linkファイルが必要です。'
                  }
                  $finalPath = [Text.StringBuilder]::new(32768)
                  $length = [Session0BootstrapNative]::GetFinalPathNameByHandleW(
                      $stream.SafeFileHandle.DangerousGetHandle(), $finalPath, $finalPath.Capacity, 0
                  )
                  if ($length -eq 0 -or $length -ge $finalPath.Capacity) {
                      throw '診断入力の最終パスを取得できません。'
                  }
                  $actualPath = $finalPath.ToString()
                  if (-not $actualPath.StartsWith('\\?\') -or $actualPath.StartsWith('\\?\UNC\')) {
                      throw '診断入力には最終ローカルパスが必要です。'
                  }
                  if (-not [string]::Equals(
                      $actualPath.Substring(4), $Path, [StringComparison]::OrdinalIgnoreCase
                  )) { throw '診断入力の最終パスが一致しません。' }
                  $memory = [IO.MemoryStream]::new()
                  try {
                      $stream.CopyTo($memory)
                      $bytes = $memory.ToArray()
                  } finally { $memory.Dispose() }
                  $actualSha256 = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes))
                  if (-not [string]::Equals(
                      $actualSha256, $ExpectedSha256, [StringComparison]::OrdinalIgnoreCase
                  )) { throw '診断入力の SHA-256 が一致しません。' }
                  return [pscustomobject]@{ Stream = $stream; Bytes = $bytes; Sha256 = $actualSha256 }
              } catch { $stream.Dispose(); throw }
          }
          $probeInput = $null
          $initBuildInput = $null
          $initSourceInput = $null
          $entryBuildInput = $null
          $entrySourceInput = $null
          $terminateBuildInput = $null
          $terminateSourceInput = $null
          $subsystemBuildInput = $null
          $windowsInitBuildInput = $null
          $windowsStartupBuildInput = $null
          $windowsStartupSourceInput = $null
          $gdi32InitBuildInput = $null
          $gdi32InitSourceInput = $null
          $win32uInitBuildInput = $null
          $win32uInitSourceInput = $null
          $win32uUser32BuildInput = $null
          $win32uUser32SourceInput = $null
          $user32ResourceBuildInput = $null
          $user32ResourceSourceInput = $null
          try {
              $probeInput = Open-VerifiedInput $probePath $expectedProbeSha256
              $initBuildInput = Open-VerifiedInput $initBuildPath $expectedInitBuildSha256
              $initSourceInput = Open-VerifiedInput $initSourcePath $expectedInitSourceSha256
              $entryBuildInput = Open-VerifiedInput $entryBuildPath $expectedEntryBuildSha256
              $entrySourceInput = Open-VerifiedInput $entrySourcePath $expectedEntrySourceSha256
              $terminateBuildInput = Open-VerifiedInput $terminateBuildPath $expectedTerminateBuildSha256
              $terminateSourceInput = Open-VerifiedInput $terminateSourcePath $expectedTerminateSourceSha256
              $subsystemBuildInput = Open-VerifiedInput $subsystemBuildPath $expectedSubsystemBuildSha256
              $windowsInitBuildInput = Open-VerifiedInput $windowsInitBuildPath $expectedWindowsInitBuildSha256
              $windowsStartupBuildInput = Open-VerifiedInput $windowsStartupBuildPath $expectedWindowsStartupBuildSha256
              $windowsStartupSourceInput = Open-VerifiedInput $windowsStartupSourcePath $expectedWindowsStartupSourceSha256
              $gdi32InitBuildInput = Open-VerifiedInput $gdi32InitBuildPath $expectedGdi32InitBuildSha256
              $gdi32InitSourceInput = Open-VerifiedInput $gdi32InitSourcePath $expectedGdi32InitSourceSha256
              $win32uInitBuildInput = Open-VerifiedInput $win32uInitBuildPath $expectedWin32uInitBuildSha256
              $win32uInitSourceInput = Open-VerifiedInput $win32uInitSourcePath $expectedWin32uInitSourceSha256
              $win32uUser32BuildInput = Open-VerifiedInput $win32uUser32BuildPath $expectedWin32uUser32BuildSha256
              $win32uUser32SourceInput = Open-VerifiedInput $win32uUser32SourcePath $expectedWin32uUser32SourceSha256
              $user32ResourceBuildInput = Open-VerifiedInput $user32ResourceBuildPath $expectedUser32ResourceBuildSha256
              $user32ResourceSourceInput = Open-VerifiedInput $user32ResourceSourcePath $expectedUser32ResourceSourceSha256
              $initBuildText = [Text.UTF8Encoding]::new($false, $true).GetString($initBuildInput.Bytes)
              $tokens = $null
              $parseErrors = $null
              # 検証済みバイト列に元のファイル情報を付け、PSScriptRoot を保って実行する。
              $initBuildAst = [Management.Automation.Language.Parser]::ParseInput(
                  $initBuildText, $initBuildPath, [ref]$tokens, [ref]$parseErrors
              )
              if ($parseErrors.Count -ne 0) { throw '追加診断のビルドスクリプトに構文エラーがあります。' }
              & ($initBuildAst.GetScriptBlock()) -BuildOnly
              if ($LASTEXITCODE -ne 0) { throw '追加診断 EXE のビルドに失敗しました。' }
              $expectedInitProbeSha256 = (Get-FileHash -LiteralPath $initProbePath -Algorithm SHA256).Hash.ToLowerInvariant()
              $entryBuildText = [Text.UTF8Encoding]::new($false, $true).GetString($entryBuildInput.Bytes)
              $tokens = $null
              $parseErrors = $null
              $entryBuildAst = [Management.Automation.Language.Parser]::ParseInput(
                  $entryBuildText, $entryBuildPath, [ref]$tokens, [ref]$parseErrors
              )
              if ($parseErrors.Count -ne 0) { throw '固定終了値診断のビルドスクリプトに構文エラーがあります。' }
              & ($entryBuildAst.GetScriptBlock()) -BuildOnly
              if ($LASTEXITCODE -ne 0) { throw '固定終了値診断 EXE のビルドに失敗しました。' }
              $expectedEntryProbeSha256 = (Get-FileHash -LiteralPath $entryProbePath -Algorithm SHA256).Hash.ToLowerInvariant()
              $terminateBuildText = [Text.UTF8Encoding]::new($false, $true).GetString($terminateBuildInput.Bytes)
              $tokens = $null
              $parseErrors = $null
              $terminateBuildAst = [Management.Automation.Language.Parser]::ParseInput(
                  $terminateBuildText, $terminateBuildPath, [ref]$tokens, [ref]$parseErrors
              )
              if ($parseErrors.Count -ne 0) { throw '固定自己終了診断のビルドスクリプトに構文エラーがあります。' }
              & ($terminateBuildAst.GetScriptBlock()) -BuildOnly
              if ($LASTEXITCODE -ne 0) { throw '固定自己終了診断 EXE のビルドに失敗しました。' }
              $expectedTerminateProbeSha256 = (Get-FileHash -LiteralPath $terminateProbePath -Algorithm SHA256).Hash.ToLowerInvariant()
              # 二候補は保持済みの共通 C++ から生成し、AST のファイル情報で固定出力先を解決する。
              $subsystemBuildText = [Text.UTF8Encoding]::new($false, $true).GetString($subsystemBuildInput.Bytes)
              $tokens = $null
              $parseErrors = $null
              $subsystemBuildAst = [Management.Automation.Language.Parser]::ParseInput(
                  $subsystemBuildText, $subsystemBuildPath, [ref]$tokens, [ref]$parseErrors
              )
              if ($parseErrors.Count -ne 0) { throw 'subsystem 対照のビルドスクリプトに構文エラーがあります。' }
              & ($subsystemBuildAst.GetScriptBlock()) -BuildOnly
              if ($LASTEXITCODE -ne 0) { throw 'subsystem 対照 EXE のビルドに失敗しました。' }
              $expectedConsoleProbeSha256 = (Get-FileHash -LiteralPath $consoleProbePath -Algorithm SHA256).Hash.ToLowerInvariant()
              $expectedWindowsProbeSha256 = (Get-FileHash -LiteralPath $windowsProbePath -Algorithm SHA256).Hash.ToLowerInvariant()
              # WINDOWS 初期化診断も保持済みの共有 Init C++ から生成する。
              $windowsInitBuildText = [Text.UTF8Encoding]::new($false, $true).GetString($windowsInitBuildInput.Bytes)
              $tokens = $null
              $parseErrors = $null
              $windowsInitBuildAst = [Management.Automation.Language.Parser]::ParseInput(
                  $windowsInitBuildText, $windowsInitBuildPath, [ref]$tokens, [ref]$parseErrors
              )
              if ($parseErrors.Count -ne 0) { throw 'WINDOWS 初期化診断のビルドスクリプトに構文エラーがあります。' }
              & ($windowsInitBuildAst.GetScriptBlock()) -BuildOnly
              if ($LASTEXITCODE -ne 0) { throw 'WINDOWS 初期化診断 EXE のビルドに失敗しました。' }
              $expectedWindowsInitProbeSha256 = (Get-FileHash -LiteralPath $windowsInitProbePath -Algorithm SHA256).Hash.ToLowerInvariant()
              # WINDOWS 起動情報診断は保持済みの専用 C++ と PS バイト列から生成する。
              $windowsStartupBuildText = [Text.UTF8Encoding]::new($false, $true).GetString($windowsStartupBuildInput.Bytes)
              $tokens = $null
              $parseErrors = $null
              $windowsStartupBuildAst = [Management.Automation.Language.Parser]::ParseInput(
                  $windowsStartupBuildText, $windowsStartupBuildPath, [ref]$tokens, [ref]$parseErrors
              )
              if ($parseErrors.Count -ne 0) { throw 'WINDOWS 起動情報診断のビルドスクリプトに構文エラーがあります。' }
              & ($windowsStartupBuildAst.GetScriptBlock()) -BuildOnly
              if ($LASTEXITCODE -ne 0) { throw 'WINDOWS 起動情報診断 EXE のビルドに失敗しました。' }
              $expectedWindowsStartupProbeSha256 = (Get-FileHash -LiteralPath $windowsStartupProbePath -Algorithm SHA256).Hash.ToLowerInvariant()
              # GDI32 明示ロード診断は保持済みの専用 C++ と PS バイト列から生成する。
              $gdi32InitBuildText = [Text.UTF8Encoding]::new($false, $true).GetString($gdi32InitBuildInput.Bytes)
              $tokens = $null
              $parseErrors = $null
              $gdi32InitBuildAst = [Management.Automation.Language.Parser]::ParseInput(
                  $gdi32InitBuildText, $gdi32InitBuildPath, [ref]$tokens, [ref]$parseErrors
              )
              if ($parseErrors.Count -ne 0) { throw 'GDI32 明示ロード診断のビルドスクリプトに構文エラーがあります。' }
              & ($gdi32InitBuildAst.GetScriptBlock()) -BuildOnly
              if ($LASTEXITCODE -ne 0) { throw 'GDI32 明示ロード診断 EXE のビルドに失敗しました。' }
              $expectedGdi32InitProbeSha256 = (Get-FileHash -LiteralPath $gdi32InitProbePath -Algorithm SHA256).Hash.ToLowerInvariant()
              # WIN32U 明示ロード診断は保持済みの専用 C++ と PS バイト列から生成する。
              $win32uInitBuildText = [Text.UTF8Encoding]::new($false, $true).GetString($win32uInitBuildInput.Bytes)
              $tokens = $null
              $parseErrors = $null
              $win32uInitBuildAst = [Management.Automation.Language.Parser]::ParseInput(
                  $win32uInitBuildText, $win32uInitBuildPath, [ref]$tokens, [ref]$parseErrors
              )
              if ($parseErrors.Count -ne 0) { throw 'WIN32U 明示ロード診断のビルドスクリプトに構文エラーがあります。' }
              & ($win32uInitBuildAst.GetScriptBlock()) -BuildOnly
              if ($LASTEXITCODE -ne 0) { throw 'WIN32U 明示ロード診断 EXE のビルドに失敗しました。' }
              $expectedWin32uInitProbeSha256 = (Get-FileHash -LiteralPath $win32uInitProbePath -Algorithm SHA256).Hash.ToLowerInvariant()
              # WIN32U 先行 USER32 診断は保持済みの専用 C++ と PS バイト列から生成する。
              $win32uUser32BuildText = [Text.UTF8Encoding]::new($false, $true).GetString($win32uUser32BuildInput.Bytes)
              $tokens = $null
              $parseErrors = $null
              $win32uUser32BuildAst = [Management.Automation.Language.Parser]::ParseInput(
                  $win32uUser32BuildText, $win32uUser32BuildPath, [ref]$tokens, [ref]$parseErrors
              )
              if ($parseErrors.Count -ne 0) { throw 'WIN32U 先行 USER32 診断のビルドスクリプトに構文エラーがあります。' }
              & ($win32uUser32BuildAst.GetScriptBlock()) -BuildOnly
              if ($LASTEXITCODE -ne 0) { throw 'WIN32U 先行 USER32 診断 EXE のビルドに失敗しました。' }
              $expectedWin32uUser32ProbeSha256 = (Get-FileHash -LiteralPath $win32uUser32ProbePath -Algorithm SHA256).Hash.ToLowerInvariant()
              # USER32 リソースマッピング診断は保持済みの専用 C++ と PS バイト列から生成する。
              $user32ResourceBuildText = [Text.UTF8Encoding]::new($false, $true).GetString($user32ResourceBuildInput.Bytes)
              $tokens = $null
              $parseErrors = $null
              $user32ResourceBuildAst = [Management.Automation.Language.Parser]::ParseInput(
                  $user32ResourceBuildText, $user32ResourceBuildPath, [ref]$tokens, [ref]$parseErrors
              )
              if ($parseErrors.Count -ne 0) { throw 'USER32 リソースマッピング診断のビルドスクリプトに構文エラーがあります。' }
              & ($user32ResourceBuildAst.GetScriptBlock()) -BuildOnly
              if ($LASTEXITCODE -ne 0) { throw 'USER32 リソースマッピング診断 EXE のビルドに失敗しました。' }
              $expectedUser32ResourceProbeSha256 = (Get-FileHash -LiteralPath $user32ResourceProbePath -Algorithm SHA256).Hash.ToLowerInvariant()
              Write-Host ('commit={0} requested_station_mask={1} verified_user32_resource_build_sha256={2} verified_user32_resource_source_sha256={3}' -f
                  $checkoutSha, $env:SBZ_DIAGNOSTIC_STATION_MASK, $user32ResourceBuildInput.Sha256, $user32ResourceSourceInput.Sha256)
              Write-Host ('commit={0} requested_station_mask={1} verified_win32u_user32_build_sha256={2} verified_win32u_user32_source_sha256={3}' -f
                  $checkoutSha, $env:SBZ_DIAGNOSTIC_STATION_MASK, $win32uUser32BuildInput.Sha256, $win32uUser32SourceInput.Sha256)
              Write-Host ('commit={0} requested_station_mask={1} verified_win32u_init_build_sha256={2} verified_win32u_init_source_sha256={3}' -f
                  $checkoutSha, $env:SBZ_DIAGNOSTIC_STATION_MASK, $win32uInitBuildInput.Sha256, $win32uInitSourceInput.Sha256)
              Write-Host ('commit={0} requested_station_mask={1} verified_gdi32_init_build_sha256={2} verified_gdi32_init_source_sha256={3}' -f
                  $checkoutSha, $env:SBZ_DIAGNOSTIC_STATION_MASK, $gdi32InitBuildInput.Sha256, $gdi32InitSourceInput.Sha256)
              Write-Host ('commit={0} requested_station_mask={1} verified_windows_init_build_sha256={2}' -f
                  $checkoutSha, $env:SBZ_DIAGNOSTIC_STATION_MASK, $windowsInitBuildInput.Sha256)
              Write-Host ('commit={0} requested_station_mask={1} verified_windows_startup_build_sha256={2} verified_windows_startup_source_sha256={3}' -f
                  $checkoutSha, $env:SBZ_DIAGNOSTIC_STATION_MASK, $windowsStartupBuildInput.Sha256, $windowsStartupSourceInput.Sha256)
              Write-Host ('commit={0} requested_station_mask={1} verified_script_sha256={2} verified_init_build_sha256={3} verified_init_source_sha256={4}' -f
                  $checkoutSha, $env:SBZ_DIAGNOSTIC_STATION_MASK, $probeInput.Sha256,
                  $initBuildInput.Sha256, $initSourceInput.Sha256)
              Write-Host ('commit={0} requested_station_mask={1} verified_entry_build_sha256={2} verified_entry_source_sha256={3}' -f
                  $checkoutSha, $env:SBZ_DIAGNOSTIC_STATION_MASK, $entryBuildInput.Sha256, $entrySourceInput.Sha256)
              Write-Host ('commit={0} requested_station_mask={1} verified_terminate_build_sha256={2} verified_terminate_source_sha256={3}' -f
                  $checkoutSha, $env:SBZ_DIAGNOSTIC_STATION_MASK, $terminateBuildInput.Sha256, $terminateSourceInput.Sha256)
              Write-Host ('commit={0} requested_station_mask={1} verified_subsystem_build_sha256={2}' -f
                  $checkoutSha, $env:SBZ_DIAGNOSTIC_STATION_MASK, $subsystemBuildInput.Sha256)
              # 各 runner でビルドした EXE の実 hash を役割ごとに記録する。
              Write-Host ('commit={0} requested_station_mask={1} expected_executable_sha256={2} expected_init_probe_sha256={3} expected_entry_probe_sha256={4} expected_terminate_probe_sha256={5}' -f
                  $checkoutSha, $env:SBZ_DIAGNOSTIC_STATION_MASK, $expectedArtifactSha256,
                  $expectedInitProbeSha256, $expectedEntryProbeSha256, $expectedTerminateProbeSha256)
              foreach ($executable in @(
                  @('executable', $artifactPath, $expectedArtifactSha256),
                  @('init_probe', $initProbePath, $expectedInitProbeSha256),
                  @('entry_probe', $entryProbePath, $expectedEntryProbeSha256),
                  @('terminate_probe', $terminateProbePath, $expectedTerminateProbeSha256),
                  @('console_probe', $consoleProbePath, $expectedConsoleProbeSha256),
                  @('windows_probe', $windowsProbePath, $expectedWindowsProbeSha256),
                  @('windows_init_probe', $windowsInitProbePath, $expectedWindowsInitProbeSha256),
                  @('windows_startup_probe', $windowsStartupProbePath, $expectedWindowsStartupProbeSha256),
                  @('gdi32_init_probe', $gdi32InitProbePath, $expectedGdi32InitProbeSha256),
                  @('win32u_init_probe', $win32uInitProbePath, $expectedWin32uInitProbeSha256),
                  @('win32u_user32_probe', $win32uUser32ProbePath, $expectedWin32uUser32ProbeSha256),
                  @('user32_resource_probe', $user32ResourceProbePath, $expectedUser32ResourceProbeSha256)
              )) {
                  Write-Host ('commit={0} requested_station_mask={1} {2}_path={3} {2}_sha256={4}' -f
                      $checkoutSha, $env:SBZ_DIAGNOSTIC_STATION_MASK, $executable[0], $executable[1], $executable[2])
              }
              $probeText = [Text.UTF8Encoding]::new($false, $true).GetString($probeInput.Bytes)
              & ([ScriptBlock]::Create($probeText)) -ArtifactPath $artifactPath `
                  -ExpectedSha256 $expectedArtifactSha256 -StationMask $env:SBZ_DIAGNOSTIC_STATION_MASK `
                  -InitProbePath $initProbePath -InitProbeSha256 $expectedInitProbeSha256 `
                  -EntryProbePath $entryProbePath -EntryProbeSha256 $expectedEntryProbeSha256 `
                  -TerminateProbePath $terminateProbePath -TerminateProbeSha256 $expectedTerminateProbeSha256 `
                  -ConsoleProbePath $consoleProbePath -ConsoleProbeSha256 $expectedConsoleProbeSha256 `
                  -WindowsProbePath $windowsProbePath -WindowsProbeSha256 $expectedWindowsProbeSha256 `
                  -WindowsInitProbePath $windowsInitProbePath -WindowsInitProbeSha256 $expectedWindowsInitProbeSha256 `
                  -WindowsStartupProbePath $windowsStartupProbePath -WindowsStartupProbeSha256 $expectedWindowsStartupProbeSha256 `
                  -Gdi32InitProbePath $gdi32InitProbePath -Gdi32InitProbeSha256 $expectedGdi32InitProbeSha256 `
                  -Win32uInitProbePath $win32uInitProbePath -Win32uInitProbeSha256 $expectedWin32uInitProbeSha256 `
                  -Win32uUser32ProbePath $win32uUser32ProbePath -Win32uUser32ProbeSha256 $expectedWin32uUser32ProbeSha256 `
                  -User32ResourceProbePath $user32ResourceProbePath -User32ResourceProbeSha256 $expectedUser32ResourceProbeSha256
              if ($LASTEXITCODE -ne 0) { throw 'Session 0 診断に失敗しました。' }
          } finally {
              foreach ($inputFile in @($user32ResourceSourceInput, $user32ResourceBuildInput, $win32uUser32SourceInput, $win32uUser32BuildInput, $win32uInitSourceInput, $win32uInitBuildInput, $gdi32InitSourceInput, $gdi32InitBuildInput, $windowsStartupSourceInput, $windowsStartupBuildInput, $windowsInitBuildInput, $subsystemBuildInput, $terminateSourceInput, $terminateBuildInput, $entrySourceInput, $entryBuildInput, $initSourceInput, $initBuildInput, $probeInput)) {
                  if ($null -ne $inputFile) { $inputFile.Stream.Dispose() }
              }
          }
