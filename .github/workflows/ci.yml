name: CI

on:
  push:
    branches: [main, "m0/**", "m1/**", "m2/**", "m3/**"]
  pull_request:

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

  hooks:
    name: C++ hooks + tracer (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cmake -S hooks -B hooks/build -A x64
      - run: cmake --build hooks/build --config Release
      - run: cargo build -p sembazuru-tracer --release
      - uses: ilammy/msvc-dev-cmd@v1
      # Gates the M1 "Done when": completeness (every /showIncludes header is
      # captured), child propagation (cl -> link), and reproducibility (two
      # runs produce identical input/output sets). clang-cl runs too (the
      # runner ships LLVM on PATH).
      - name: M1 tracer smoke (completeness, propagation, reproducibility)
        run: pwsh -NoProfile -File hooks/test/smoke.ps1 -RequireClangCl
      # Gates the M2 "Done when": representative C++ TUs reproduce their output
      # *bytes*. MSVC is checked for content determinism (same build root);
      # clang-cl for path independence across different roots (required here —
      # the runner ships LLVM). See docs/determinism.md.
      - name: M2 determinism harness (byte reproducibility)
        run: pwsh -NoProfile -File hooks/test/determinism.ps1 -RequireClangCl
