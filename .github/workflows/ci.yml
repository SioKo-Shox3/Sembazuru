name: CI

on:
  push:
    branches: [main, "m0/**", "m1/**", "m2/**", "m3/**", "m4/**", "m5/**", "m6/**"]
  pull_request:

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

  hooks:
    name: C++ hooks + tracer (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cmake -S hooks -B hooks/build -A x64
      - run: cmake --build hooks/build --config Release
      - run: cargo build -p sembazuru-tracer --release
      - uses: ilammy/msvc-dev-cmd@v1
      # Gates the M1 "Done when": completeness (every /showIncludes header is
      # captured), child propagation (cl -> link), and reproducibility (two
      # runs produce identical input/output sets). clang-cl runs too (the
      # runner ships LLVM on PATH).
      - name: M1 tracer smoke (completeness, propagation, reproducibility)
        run: pwsh -NoProfile -File hooks/test/smoke.ps1 -RequireClangCl
      # Gates M3.1.5: the NtSetInformationFile hook makes clang/lld's
      # temp->rename visible (docs/trace-format.md §8), so the surviving output
      # is discovered from the trace and the run-varying temp is excluded.
      - name: M3.1.5 NT-rename observability
        run: pwsh -NoProfile -File hooks/test/nt_rename.ps1
      # Gates the M2 "Done when": representative C++ TUs reproduce their output
      # *bytes*. MSVC is checked for content determinism (same build root);
      # clang-cl for path independence across different roots (required here —
      # the runner ships LLVM). See docs/determinism.md.
      - name: M2 determinism harness (byte reproducibility)
        run: pwsh -NoProfile -File hooks/test/determinism.ps1 -RequireClangCl
      # Gates M3.2: a hooked read-open under the VFS root is redirected to the
      # agent-supplied bytes (hydrated to a local scratch copy), proving the
      # observe->virtualize flip end to end.
      - name: M3.2 read-VFS redirect
        run: pwsh -NoProfile -File hooks/test/vfs_redirect.ps1
      # The M3 "Done when" compile path: a compiler runs under the read VFS with
      # inputs supplied by the agent; for clang-cl the remote .obj must be
      # byte-identical to a local build (required here -- the runner ships LLVM).
      - name: M3 remote compile under VFS (clang-cl byte-identical)
        run: pwsh -NoProfile -File hooks/test/vfs_compile.ps1 -RequireClangCl
      # M3.5 speed "Done when": injected RTT barely moves the compile time
      # (few project-file round-trips; SDK is worker-local), and the VFS compile
      # is not catastrophically slower than local. See docs/decisions/0002.
      - name: M3.5 VFS speed (round-trips do not break the compile)
        run: pwsh -NoProfile -File hooks/test/vfs_bench.ps1
      # M4 "Done when" (compile-execution half): the second build of an
      # unchanged project HITs the action cache (compile skipped) and reproduces
      # build 1's output byte-for-byte; a changed input MISSes. clang-cl runs too
      # (the runner ships LLVM). The transfer half is the Rust worker-cache test.
      - name: M4 action-cache rebuild (2nd build skips compilation)
        run: pwsh -NoProfile -File hooks/test/m4_cache_rebuild.ps1 -RequireClangCl
