name: CI

on:
  push:
    branches: [main, "m0/**", "m1/**", "m2/**", "m3/**", "m4/**", "m5/**", "m6/**", "m7/**", "m8/**"]
  pull_request:

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

  hooks:
    name: C++ hooks + tracer (MSVC)
    # M7.3 Windows-version matrix: run the hook/Detours + determinism + injection
    # gates on more than one Windows image so an OS update (or a Detours-fork
    # regression against it) is caught automatically. fail-fast off so one OS
    # leg's failure does not hide the other's result.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cmake -S hooks -B hooks/build -A x64
      - run: cmake --build hooks/build --config Release
      # M7.3: also build the 32-bit interceptor (and the probe) and place the
      # 32-bit DLL next to the 64-bit one, so Detours' cross-bitness sibling
      # lookup finds it when a 64-bit injector spawns a 32-bit child.
      - run: cmake -S hooks -B hooks/build32 -A Win32
      - run: cmake --build hooks/build32 --config Release
      - name: Stage 32-bit interceptor next to the 64-bit one
        run: Copy-Item hooks/build32/Release/sbz_interceptor32.dll hooks/build/Release/ -Force
      - run: cargo build -p sembazuru-tracer --release
      - uses: ilammy/msvc-dev-cmd@v1
      # Ninja for the M6.3 CMake/Ninja gate (the COMPILER_LAUNCHER path). GitHub's
      # Windows images do not put ninja on PATH by default, and the hooks build
      # above uses the VS generator; choco (preinstalled on the runner, no new
      # marketplace action) provides ninja for the gate.
      - name: Install ninja (for the M6.3 CMake/Ninja gate)
        run: choco install ninja -y --no-progress
      # Gates the M1 "Done when": completeness (every /showIncludes header is
      # captured), child propagation (cl -> link), and reproducibility (two
      # runs produce identical input/output sets). clang-cl runs too (the
      # runner ships LLVM on PATH).
      - name: M1 tracer smoke (completeness, propagation, reproducibility)
        run: pwsh -NoProfile -File hooks/test/smoke.ps1 -RequireClangCl
      # Gates M3.1.5: the NtSetInformationFile hook makes clang/lld's
      # temp->rename visible (docs/trace-format.md §8), so the surviving output
      # is discovered from the trace and the run-varying temp is excluded.
      - name: M3.1.5 NT-rename observability
        run: pwsh -NoProfile -File hooks/test/nt_rename.ps1
      # Gates the M2 "Done when": representative C++ TUs reproduce their output
      # *bytes*. MSVC is checked for content determinism (same build root);
      # clang-cl for path independence across different roots (required here —
      # the runner ships LLVM). See docs/determinism.md.
      - name: M2 determinism harness (byte reproducibility)
        run: pwsh -NoProfile -File hooks/test/determinism.ps1 -RequireClangCl
      # Gates M3.2: a hooked read-open under the VFS root is redirected to the
      # agent-supplied bytes (hydrated to a local scratch copy), proving the
      # observe->virtualize flip end to end.
      - name: M3.2 read-VFS redirect
        run: pwsh -NoProfile -File hooks/test/vfs_redirect.ps1
      # The M3 "Done when" compile path: a compiler runs under the read VFS with
      # inputs supplied by the agent; for clang-cl the remote .obj must be
      # byte-identical to a local build (required here -- the runner ships LLVM).
      - name: M3 remote compile under VFS (clang-cl byte-identical)
        run: pwsh -NoProfile -File hooks/test/vfs_compile.ps1 -RequireClangCl
      # M3.5 speed "Done when": injected RTT barely moves the compile time
      # (few project-file round-trips; SDK is worker-local), and the VFS compile
      # is not catastrophically slower than local. See docs/decisions/0002.
      - name: M3.5 VFS speed (round-trips do not break the compile)
        run: pwsh -NoProfile -File hooks/test/vfs_bench.ps1
      # M4 "Done when" (compile-execution half): the second build of an
      # unchanged project HITs the action cache (compile skipped) and reproduces
      # build 1's output byte-for-byte; a changed input MISSes. clang-cl runs too
      # (the runner ships LLVM). The transfer half is the Rust worker-cache test.
      - name: M4 action-cache rebuild (2nd build skips compilation)
        run: pwsh -NoProfile -File hooks/test/m4_cache_rebuild.ps1 -RequireClangCl
      # Gates M6.1b: a real sembazuru-worker process, driven over gRPC with
      # ExecuteRequest.vfs, injects the hook DLL via launcher.exe and supplies the
      # read on demand from the agent file server — proving the production VFS
      # execution path (not just the vfs_host harness) redirects to agent bytes.
      - name: M6.1b worker VFS execution (Execute redirects to agent bytes)
        run: pwsh -NoProfile -File hooks/test/m6_worker_vfs_redirect.ps1
      # Gates the M6.1 "Done when" for CMake/Ninja+clang-cl: a compile through the
      # production launcher->daemon->worker path is byte-identical to a local
      # build (clang-cl), falls back locally when the daemon is down, and a 2nd
      # identical build HITS the action cache (compile skipped). clang-cl is the
      # byte-identity gate (the runner ships LLVM).
      - name: M6.1 daemon compile (distributed byte-identical, fallback, cache hit)
        run: pwsh -NoProfile -File hooks/test/m6_daemon_compile.ps1 -RequireClangCl
      # Gates M7.0 (ADR 0006): the SAME production daemon compile, but with the
      # daemon and worker running AUTHENTICATED (shared cluster token on both the
      # control plane Register and the data-plane Hello handshake). Proves the
      # authed Register->VFS path runs end to end AND that auth is connection-level
      # only — the clang-cl .obj stays byte-identical to the local build.
      - name: M7.0 authed daemon compile (shared-token, byte-identical)
        run: pwsh -NoProfile -File hooks/test/m6_daemon_compile.ps1 -RequireClangCl -AuthToken sbz-ci-cluster-token
      # Gates M6.2: an MSBuild .vcxproj build routed through the daemon via the
      # CLToolExe launcher shim — the compile runs remotely and falls back locally
      # when the daemon is down. MSVC cl is byte-best-effort, so this checks the
      # interception mechanism (the CMake/Ninja path carries the clang-cl bytes).
      - name: M6.2 MSBuild integration (CLToolExe shim routes through the daemon)
        run: pwsh -NoProfile -File hooks/test/m6_msbuild.ps1
      # Gates M6.3: a real multi-TU CMake project built with the Ninja generator
      # and CMAKE_<LANG>_COMPILER_LAUNCHER (the cleanest production hook, docs/
      # integrations). Every TU distributes through the daemon; each clang-cl .obj
      # is byte-identical to a non-distributed reference; the link stays local
      # (exe runs, exits 0); a 2nd build with the worker stopped HITS the cache for
      # every TU; and with the daemon down ninja still completes (local fallback).
      # timeout-minutes bounds a stuck child (M7.3 lesson).
      - name: M6.3 ninja distributed build (clang-cl byte-identical, cache hit, fallback)
        timeout-minutes: 10
        run: pwsh -NoProfile -File hooks/test/m6_ninja.ps1 -RequireClangCl -RequireNinja
      # Gates M7.3: a 64-bit injector spawning a 32-bit child gets the 32-bit
      # interceptor (sbz_interceptor32.dll) via Detours' cross-bitness sibling
      # lookup. Positive (trace written, child's open captured) + negative control
      # (remove the 32-bit sibling -> no trace).
      - name: M7.3 cross-bitness injection (64-bit injector -> 32-bit child)
        run: pwsh -NoProfile -File hooks/test/m7_inject32.ps1
      # Gates the M8 "Done when" (DESIGN §7): an ARBITRARY non-compiler process
      # distributes with NO dedicated support. dxc (the HLSL shader compiler) runs
      # through the SAME launcher->daemon->worker path as clang-cl — no dxc code in
      # the binaries — and the distributed .dxil is byte-identical to local, falls
      # back locally with the daemon down, and a 2nd build HITS the cache via
      # trace-based output discovery (M8.1). Runs with strict VFS on (M8.2), which
      # must not spuriously fire when supply works. dxc comes from the Windows SDK
      # on the runner; -RequireDxc fails the gate if it is absent. timeout-minutes
      # bounds it (M7.3 lesson: a stuck child process must not hang CI).
      - name: M8.4 dxc distribution (arbitrary process, byte-identical, fallback, cache hit)
        timeout-minutes: 10
        run: pwsh -NoProfile -File hooks/test/m8_dxc.ps1 -RequireDxc
      # Gates M8.5 (ADR 0007 §c): the SAME dxc action marked non-deterministic
      # (SEMBAZURU_NONDETERMINISTIC=1) still DISTRIBUTES (build 1 remote) but is
      # NEVER cached — build 2 with the worker stopped does NOT hit the cache and
      # falls back locally. Proves the flag separates distribution from caching
      # (the mechanism a non-byte-reproducible test runner would use).
      - name: M8.5 non-deterministic policy (distributed but not cached)
        timeout-minutes: 10
        run: pwsh -NoProfile -File hooks/test/m8_dxc.ps1 -RequireDxc -NonDeterministic
      # Gates M7.2: the Authenticode sign->verify pipeline. Runs LAST so it signs
      # the final artifacts (launcher.exe + hook DLL) without perturbing the
      # compile gates above. Uses an ephemeral self-signed cert to prove the
      # mechanism; a real release swaps in an OV cert (docs/security/edr-allowlist.md).
      - name: M7.2 Authenticode signing pipeline (sign+verify, placeholder cert)
        run: pwsh -NoProfile -File hooks/test/sign_smoke.ps1
