[package]
name = "sembazuru-cas"
description = "Content-addressable storage: dedup store and action cache"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Content hash for digest-as-identity (ADR 0003: BLAKE3, decided with real data
# in docs/decisions/0003-cas-hash-and-chunking.md). CC0 OR Apache-2.0.
blake3 = "1"

# Measurement-only dependencies for the `hash_bench` example (M4.0), kept so the
# ADR's numbers stay reproducible: it compares blake3 against `sha2` (SHA-NI)
# and the tracer's std-only hand-rolled SHA-256. These do not enter the library.
[dev-dependencies]
proptest = "1"
# sha2 0.10 auto-selects the x86 SHA-NI backend at runtime (cpufeatures), no
# external assembler needed — the "best-case SHA-256" the ADR measures against.
sha2 = "0.10"
sembazuru-tracer = { path = "../tracer" }
