[package]
name = "sembazuru-cas"
description = "Content-addressable storage: dedup store and action cache"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]

# Measurement-only dependencies (M4.0). The hash/chunk ADR (docs/decisions/
# 0003-cas-hash-and-chunking.md) is decided with real data, so the `hash_bench`
# example compares three implementations head to head:
#   * the tracer's std-only hand-rolled SHA-256 (today's digest-as-identity),
#   * `sha2` with the SHA-NI backend (RustCrypto),
#   * `blake3` (the candidate).
# These are dev-dependencies so the production dependency surface stays empty
# until the ADR lands and M4.1 promotes the winner to a real dependency.
[dev-dependencies]
blake3 = "1"
# sha2 0.10 auto-selects the x86 SHA-NI backend at runtime (cpufeatures), no
# external assembler needed — that is exactly the "best-case SHA-256" we want to
# measure against blake3.
sha2 = "0.10"
sembazuru-tracer = { path = "../tracer" }
