[package]
name = "sembazuru-dataplane"
description = "File-supply data plane: hand-rolled length-prefixed framing and batch-first op codecs (no protobuf on the hot path)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The codec is dependency-free std-only hand-rolled binary (docs/protocol/v0.md
# §4.2 forbids protobuf on the hot path), in the same spirit as the tracer's
# std-only SHA-256. The async frame I/O that carries these frames over a byte
# stream is gated behind an optional `tokio` feature, so the codec still builds
# and unit-tests with no runtime; agent/worker enable the feature.
[dependencies]
tokio = { version = "1", features = ["io-util"], optional = true }

[features]
tokio = ["dep:tokio"]
