syntax = "proto3";

package sembazuru.v0;

// Sembazuru control plane, v0. See docs/protocol/v0.md §3.
//
// Control traffic is low-rate (scheduling, lifecycle, keepalive); the
// latency-critical file supply lives in the hand-rolled binary data plane
// (docs/protocol/v0.md §4) and carries NO protobuf. protocol_version is
// negotiated at Register time (§6); v0 = 0, and v0 makes no compatibility
// promises until M3 ships.

// A content digest. The hash algorithm is deliberately open (§4.1; candidate
// BLAKE3, decided with CAS chunking in M4). For M3 this carries the M2
// std-only SHA-256 used purely as content identity (no dedup yet).
message Digest {
  string algorithm = 1;  // e.g. "sha256"
  string hex = 2;        // lowercase hex of the digest
  uint64 size = 3;       // bytes of the addressed content
}

// ---- Coordination: registration & keepalive (§3.1) -----------------------

service Coordination {
  // Worker -> Agent: announce capabilities and negotiate the protocol version.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Bidirectional keepalive; either side noticing silence may trigger
  // fallback (§3.2).
  rpc Heartbeat(stream HeartbeatPing) returns (stream HeartbeatPong);
}

message Capabilities {
  uint32 protocol_version = 1;                 // v0 = 0 (§6)
  string os_build = 2;                         // Windows build number
  string arch = 3;                             // e.g. "x86_64"
  uint32 cpu_count = 4;
  uint64 memory_bytes = 5;
  // Data-plane transports the peer supports, so the data plane can evolve
  // independently of the control plane (§3.1). Names, e.g. "tcp-framed".
  repeated string data_plane_transports = 6;
  // Capability flag (§6): the worker speaks the M7 shared-token auth handshake
  // (ADR 0006) and carries auth_token in RegisterRequest / the data-plane
  // session handshake. An agent with a cluster token configured rejects a
  // worker that does not advertise this; an agent without a token ignores it.
  // Gating is by capability flag, not version sniffing (§6).
  bool supports_auth = 7;
  // Build version of this worker = its CARGO_PKG_VERSION (the workspace version),
  // for version-gated admission (ADR 0011). The agent admits a worker to
  // scheduling only when this EXACTLY matches the agent's own version, so a
  // mixed-version cluster cannot poison build determinism / the action cache. An
  // empty string (a pre-0011 worker) never matches and is excluded — intended.
  // NOTE: this is NOT the §6 "no version sniffing" wire-compat rule. That rule is
  // about protocol back-compat (gate features by capability flag). This is a
  // separate admission/scheduling layer that protects build-output determinism,
  // not protocol compatibility (ADR 0011 §5).
  string worker_version = 8;
  // How the worker participates (ADR 0012): "always" | "adaptive" | "off". The
  // agent excludes a worker whose mode is "off" from scheduling (it stays
  // registered and visible). "always" reports no idle_cpu_pct (full static
  // capacity); "adaptive" rides idle CPU (ADR 0010). Empty (a pre-0012 worker) is
  // treated as participating (not "off"); the version gate (worker_version) already
  // excludes such an old worker. Generalizes ADR 0010's idle-cpu on/off toggle.
  string participation_mode = 9;
  // Capability flag (§6): the worker presents the agent-minted, unpredictable
  // session_id on the data-plane Hello so the agent binds file supply to the
  // authoritative session — its own scope root (not the worker-declared one),
  // a per-session pin partition, an allowed-digest set, and the declared output
  // set (ADR 0013, closing COR-001/SEC-003/SEC-004/PROTO-001-predictability).
  // A worker that does not advertise this sends an empty session_id and the agent
  // falls back to the legacy per-connection, worker-declared-root scoping — so a
  // mixed cluster keeps working. Gating is by capability flag, not version
  // sniffing (§6); the operative runtime signal is the non-empty session_id.
  bool supports_session_capability = 10;
}

message RegisterRequest {
  string worker_id = 1;
  Capabilities caps = 2;
  // Where the agent should dial this worker's Execution service. Coordination
  // is worker->agent push (§3.1), so the worker announces its own Execution
  // endpoint here; the agent learns it from registration, not a static list.
  string execution_endpoint = 3;  // e.g. "http://127.0.0.1:50061"
  // Shared cluster auth token (M7, ADR 0006). The trust model is LAN-trusted:
  // the worker presents a shared secret (distributed out-of-band via the
  // SEMBAZURU_CLUSTER_TOKEN env var) and the agent matches it. Empty when the
  // cluster runs without a token, in which case the agent accepts
  // unconditionally (back-compat with M5/M6). Field 11 stays reserved for a
  // future client-cert / attestation field, so a wire-compatible move to mTLS /
  // zero-trust remains open (ADR 0006 "future").
  string auth_token = 10;
  reserved 11;
}

message RegisterResponse {
  uint32 protocol_version = 1;  // negotiated (min of the two peers); v0 = 0
  bool accepted = 2;
  string detail = 3;            // reason when accepted == false
}

message HeartbeatPing {
  string worker_id = 1;
  uint64 monotonic_qpc = 2;     // worker QueryPerformanceCounter sample
  // Capacity pushed on every ping so the agent's least-loaded scheduling
  // (ADR 0004) needs no separate pull RPC. idle_slots = cpu_count -
  // running_actions, clamped at 0.
  uint32 running_actions = 3;
  uint32 idle_slots = 4;
  // Smoothed host idle-CPU percent (0-100), the "good neighbour" signal (ADR
  // 0010). `optional` is load-bearing: a bare uint32 would default to 0 on the
  // wire, which is indistinguishable from a genuine 0%-idle worker, so a pre-0010
  // worker or one with the feature off would be read as "0% idle" and starved.
  // Presence means "this worker reports CPU load"; absence means "no CPU signal",
  // and the agent's effective_idle() then falls back to the legacy slot count.
  optional uint32 idle_cpu_pct = 5;
}

message HeartbeatPong {
  uint64 agent_monotonic_us = 1;
}

// ---- Execution: action lifecycle (§3.2) ----------------------------------

service Execution {
  // Agent -> Worker: run this process under virtualization. Inputs are
  // discovered on demand over the data plane, so the request names the input
  // ROOT identity, not a file list — that on-demand discovery is the point.
  rpc Execute(ExecuteRequest) returns (stream ExecuteEvent);
  // Agent -> Worker: give up on a remote action (worker death, partition,
  // latency budget exceeded). The agent may then re-execute locally (§3.2).
  rpc Abort(AbortRequest) returns (AbortResponse);
}

message Command {
  repeated string argv = 1;
  map<string, string> env = 2;
  string cwd = 3;               // working directory as seen locally (§3.2)
}

message ExecuteRequest {
  string action_id = 1;
  Command command = 2;
  string session_id = 3;        // binds to a data-plane file session (§3.2)
  Digest predicted_inputs = 4;  // optional prefetch hint manifest digest (unused)
  // Dependency-prediction prefetch (M5.4, §4.1): the agent-side logical paths a
  // prior build of this action read. The worker warms these into its cache
  // ahead of process I/O, killing the first-build round-trips. v0 §4.1 frames
  // PrefetchHint as "agent-pushed"; in the worker-pull data plane the hint rides
  // the control plane here and the worker warms over the existing data-plane ops.
  // A worker that ignores it is still correct (it just does not pre-warm).
  repeated string predicted_paths = 5;
  // Read-VFS execution (M6.1). When present, the worker runs the process under
  // the injected hook DLL with on-demand file supply from the agent (the
  // production compile path); when ABSENT the worker plain-spawns the process
  // (the M5 scale path — back-compat). Unlike predicted_paths, this is NOT
  // advisory: a worker that ignores it would run the compiler with no inputs.
  VfsExecution vfs = 6;
}

// Configures the worker's read-VFS execution mode (M6.1). The worker starts a
// per-action VFS pipe dialing `agent_fileserver`, injects the hook DLL, and
// points its redirect at `vfs_root`. Reads under `vfs_root` are supplied on
// demand by the agent; writes (the .obj) are NOT redirected — on a single
// machine they land at the local output path the command line names.
message VfsExecution {
  // host:port of the agent's data-plane file server (the worker dials it).
  string agent_fileserver = 1;
  // Agent-side logical root under which read-only opens are redirected to the
  // agent. Picks the project source tree, not the SDK (SDK stays worker-local).
  string vfs_root = 2;
  // Where the injected DLL writes the action's input trace, so the agent can
  // build the input manifest for the action cache. SINGLE-MACHINE ONLY: agent
  // and worker share the filesystem here; a 2-machine split moves trace
  // ingestion onto the data plane (deferred with real-LAN, ADR 0004 §M5.5).
  string trace_dir = 3;
  // Strict virtualization (M8.2, ADR 0007 §a②). When true, a read-only open
  // under `vfs_root` that the agent could NOT supply must FAIL rather than
  // fall through to a local open: on a worker without the source co-located,
  // that local open would silently read the wrong (or no) file. The DLL marks
  // the unvirtualized access and the worker turns it into a "did not complete"
  // so the agent re-runs the whole action locally. Default false keeps the
  // single-machine compiler behavior (fail-open is harmless when the bytes are
  // co-located) — so all M3-M7 gates are unchanged.
  bool strict = 4;
}

// Worker-side state machine (§3.2):
//   QUEUED -> PREPARING -> RUNNING -> COMPLETED
//                |            |    \-> FAILED   (worker reports cause)
//                \------------+------> ABORTED  (agent gave up / fallback)
enum ActionState {
  ACTION_STATE_UNSPECIFIED = 0;
  QUEUED = 1;
  PREPARING = 2;
  RUNNING = 3;
  COMPLETED = 4;
  FAILED = 5;
  ABORTED = 6;
}

message StateChange {
  ActionState state = 1;
  string detail = 2;            // human-readable cause for FAILED/ABORTED
}

// A produced output file. The bytes are returned over the data plane
// (WriteBack, §4.1); this only announces identity + path. The path is the
// agent-side logical path the action wrote, so the agent can publish it
// atomically into the declared output set (§3.2).
message OutputAvailable {
  string path = 1;
  Digest digest = 2;
}

message ExitStatus {
  int32 exit_code = 1;
  uint64 wall_time_us = 2;      // worker-measured wall clock
  uint64 user_time_us = 3;
  uint64 kernel_time_us = 4;
  // COR-005 worker re-verification: hex content digest of the toolchain binary the
  // worker actually resolved+launched for argv[0]. The agent compares it to the
  // digest it folded into the weak key and SKIPS recording on a mismatch (a
  // heterogeneous agent != worker compiler), so a different binary's result is
  // never recorded under this key. Empty = not reported. Additive proto3 field.
  string resolved_tool_digest = 5;
}

// A chunk of the process's console output (M6.1). The compiler's diagnostics run
// on the worker; without streaming them back, a developer driving the build via
// the launcher would see no warnings/errors. is_stderr selects the stream.
message OutputChunk {
  bool is_stderr = 1;  // false = stdout
  bytes data = 2;
}

message ExecuteEvent {
  oneof event {
    StateChange state = 1;
    OutputAvailable output = 2;
    ExitStatus exit = 3;
    OutputChunk stdio = 4;  // streamed compiler console output (M6.1)
  }
}

message AbortRequest {
  string action_id = 1;
  string reason = 2;            // e.g. "fallback: latency budget exceeded"
}

message AbortResponse {
  bool acknowledged = 1;
}

// ---- LocalIntake: build-system launcher -> agent daemon (M6) --------------

// A compiler launcher (e.g. set as CMAKE_<LANG>_COMPILER_LAUNCHER, or an MSBuild
// CLToolExe shim) is a short-lived process the build system invokes as
// `sembazuru <compiler> <args...>`. It hands that one action to the long-lived
// agent daemon, which schedules it across workers (or runs it locally on
// fallback), then mirrors the result so the launcher exits exactly as the
// compiler would have.
//
// This plane is LOCAL-ONLY (loopback to the daemon on the same machine). Unlike
// Execution (agent -> worker, which names only the input *root* because inputs
// are discovered on demand, §3.2), SubmitAction carries the full command the
// build system would have run — the launcher already has it on its argv.
service LocalIntake {
  // Launcher -> daemon: run this compiler invocation and stream its lifecycle
  // and final exit. The stream ends after exactly one ExitStatus.
  rpc SubmitAction(SubmitActionRequest) returns (stream SubmitActionEvent);
}

message SubmitActionRequest {
  // The full command, with argv[0] = the real compiler (the launcher strips its
  // own argv[0]). cwd is the launcher's working directory — the basis the agent
  // uses to identify the input root (§3.2).
  Command command = 1;
  // Output paths the build system expects this action to produce, when they can
  // be declared (external SEMBAZURU_OUTPUTS, or inferred from a clang-cl /Fo).
  // Empty means "discover the outputs from the action trace" (M6.1/M8.1). The
  // ordering is external-declared > trace-discovered > uncached (ADR 0007 §b).
  // Advisory only.
  repeated string declared_outputs = 2;
  // The action is non-deterministic (its outputs are not byte-reproducible for
  // identical inputs, e.g. a test that embeds a timestamp). Distribute it but do
  // NOT record it in the action cache — serving a stale byte-identical-input
  // result would be wrong (ADR 0007 §c: separate distribution from caching).
  // Default false = deterministic = cacheable (M4-M7 back-compat).
  bool non_deterministic = 3;
  // Run under strict virtualization: an unsuppliable read under the input root
  // fails the action (→ local fallback) instead of silently reading a local
  // file (ADR 0007 §a②). For arbitrary processes whose inputs are not
  // co-located on the worker. Default false preserves the compiler behavior.
  // The launcher sets it from SEMBAZURU_VFS_STRICT; the daemon copies it into
  // VfsExecution.strict.
  bool strict_vfs = 4;
  // Declared input root: the agent-side directory under which the worker's reads
  // are virtualized (becomes VfsExecution.vfs_root). EMPTY = use cwd (the M6/M7
  // compiler default, where the project tree is the cwd). An arbitrary process
  // may read above its cwd (e.g. ../shared), so the build integration can declare
  // a broader root here (M8.3, ADR 0007). The launcher sets it from
  // SEMBAZURU_INPUT_ROOT. Must contain cwd so outputs/inputs under cwd stay in
  // scope.
  string input_root = 5;
}

message SubmitActionEvent {
  oneof event {
    // Lifecycle mirror. For a remote action these echo the worker's
    // ActionState transitions; for a local fallback the detail carries the
    // fallback reason so the developer can see why it ran locally.
    StateChange state = 1;
    // The exit code the launcher must exit with. Emitted exactly once, last.
    ExitStatus exit = 2;
    // The compiler's console output, forwarded so the launcher can replay it to
    // the developer's stdout/stderr (M6.1).
    OutputChunk stdio = 3;
  }
}

// ---- Status: daemon status surface for the resident GUI (M9.1, ADR 0008) ---

// The daemon's operational status surface for the resident GUI (M9, ADR 0008
// §4). Like LocalIntake this plane is LOOPBACK-ONLY: it exposes operational
// state (the connected workers and their health, the action-cache hit rate,
// in-flight actions, and where actions ran) to a SAME-MACHINE GUI, never to
// workers. Keeping it off the worker-facing Coordination port (which is
// LAN-reachable and cluster-token authenticated, ADR 0006) means the GUI needs
// no token and admin/status never rides the network-facing endpoint.
//
// GetStatus is read-only. TriggerEviction (M9.2) is the first admin RPC; the
// config get/set RPCs the GUI also needs arrive with the config work (M9.3) as
// non-breaking additions here.
service Status {
  // GUI -> daemon: a snapshot of the daemon's live operational state.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  // GUI -> daemon: evict the action cache down to the configured size cap
  // (SEMBAZURU_CACHE_MAX_BYTES) now, instead of waiting for the daemon's periodic
  // sweep (M9.2). Eviction is correctness-safe — it can only turn a later cache
  // lookup into a miss, never a wrong result. A no-op when no cache or no cap is
  // configured (cap_configured = false).
  rpc TriggerEviction(TriggerEvictionRequest) returns (TriggerEvictionResponse);
  // GUI -> daemon: read the persisted daemon config — the GUI's editable view of
  // the SEMBAZURU_* settings (M9.3, ADR 0008 §3). The cluster token is NEVER
  // returned, only whether one is set, so the secret is not echoed over the wire.
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  // GUI -> daemon: persist the daemon config to %ProgramData%\Sembazuru\daemon.toml.
  // Applied on the next daemon start (no live reload, ADR 0008).
  rpc SetConfig(SetConfigRequest) returns (SetConfigResponse);
}

message GetStatusRequest {}

message TriggerEvictionRequest {}

message TriggerEvictionResponse {
  uint64 freed_bytes = 1;       // bytes evicted by this call
  uint64 size_bytes_after = 2;  // CAS size after eviction
  bool cap_configured = 3;      // false when no SEMBAZURU_CACHE_MAX_BYTES is set
}

message GetConfigRequest {}

// The persisted daemon config (M9.3). Mirrors crates/agent/src/config.rs
// DaemonConfig, EXCEPT the cluster token, which is never echoed — only its
// presence (cluster_token_set). Empty string = unset; 0 = uncapped.
message GetConfigResponse {
  string config_path = 1;       // where the file is read from / written to
  bool file_exists = 2;         // whether a daemon.toml is present on disk
  string coord_addr = 3;
  string intake_addr = 4;
  string fileserver_addr = 5;
  string status_addr = 6;
  string cache_root = 7;        // empty = caching disabled
  string trace_root = 8;        // empty = use a temp dir
  uint64 cache_max_bytes = 9;   // 0 = uncapped
  bool cluster_token_set = 10;  // presence only — the secret is never echoed
}

// Writes the persisted daemon config. Addresses are kept (not cleared) when sent
// empty, so a GUI that only edits one knob need not re-send valid addresses; the
// optional fields are cleared by an empty value.
message SetConfigRequest {
  string coord_addr = 1;        // empty = keep the existing value
  string intake_addr = 2;       // empty = keep the existing value
  string fileserver_addr = 3;   // empty = keep the existing value
  string status_addr = 4;       // empty = keep the existing value
  string cache_root = 5;        // empty = unset (caching disabled)
  string trace_root = 6;        // empty = unset (temp dir)
  uint64 cache_max_bytes = 7;   // 0 = uncapped
  // The cluster token, kept out of the read path. absent = leave unchanged;
  // present-and-empty = clear (disable auth); present-and-nonempty = set.
  optional string cluster_token = 8;
}

message SetConfigResponse {
  bool ok = 1;
  string detail = 2;  // e.g. "saved to <path>; restart the daemon to apply"
}

// One connected worker as seen by the agent. Mirrors the live WorkerTable entry
// (coordination.rs): caps + the last heartbeat-reported load, plus how long ago
// the agent last heard from it. Only currently-live workers are listed.
message WorkerStatus {
  string worker_id = 1;
  string execution_endpoint = 2;
  uint32 cpu_count = 3;
  string os_build = 4;
  string arch = 5;
  uint32 running_actions = 6;    // last heartbeat-reported running count
  uint32 idle_slots = 7;        // last heartbeat-reported idle slots
  uint64 last_ping_age_ms = 8;  // ms since the agent last heard from this worker
  bool healthy = 9;             // live within the dead-detection window
  // Last heartbeat-reported smoothed idle-CPU percent (0-100), for the dashboard
  // (ADR 0010). Absent when the worker reports no CPU signal; same presence
  // semantics as HeartbeatPing.idle_cpu_pct.
  optional uint32 idle_cpu_pct = 10;
  // The worker's reported build version, mirrored from Capabilities.worker_version
  // for the dashboard (ADR 0011). Empty for a pre-0011 worker.
  string worker_version = 11;
  // Why this worker is excluded from scheduling, or "" when it is eligible. The
  // agent-computed admission reason for the dashboard: "version-mismatch" (ADR
  // 0011), "off" (ADR 0012 participation mode), or "cpu-busy" (ADR 0010 effective
  // capacity 0). Single source of truth: scheduler::exclusion_reason.
  string exclusion_reason = 12;
  // The worker's participation mode (ADR 0012), mirrored from
  // Capabilities.participation_mode for the dashboard: "always" | "adaptive" |
  // "off" (empty for a pre-0012 worker).
  string participation_mode = 13;
}

// Action-cache state. hits/misses are counted since this daemon started; the GUI
// derives the hit rate as hits / (hits + misses) so no float rides the wire.
message CacheStatus {
  bool enabled = 1;        // a cache root is configured (SEMBAZURU_CACHE_ROOT)
  uint64 size_bytes = 2;   // current on-disk CAS size (0 when disabled)
  uint64 hits = 3;
  uint64 misses = 4;
  uint64 max_bytes = 5;    // configured size cap (SEMBAZURU_CACHE_MAX_BYTES); 0 = uncapped
}

// Where completed actions ran (ADR 0008 §4): remote = ran on a worker;
// local = deliberately kept local by the route-away screen (ADR 0007 §a①);
// fallback = wanted a worker but every remote attempt failed / none were live.
message ExecBreakdown {
  uint64 remote = 1;
  uint64 local = 2;
  uint64 fallback = 3;
}

// Data-plane file-server counters (content bytes the agent pushed to workers).
message FileServerStatus {
  uint64 read_ops = 1;
  uint64 read_bytes = 2;     // content bytes returned in Read responses
  uint64 inline_bytes = 3;   // content bytes inlined in OpenRead first chunks
}

message GetStatusResponse {
  repeated WorkerStatus workers = 1;
  CacheStatus cache = 2;
  uint32 in_flight = 3;       // actions the daemon is currently driving
  ExecBreakdown exec = 4;
  FileServerStatus fileserver = 5;
  bool auth_enabled = 6;      // the daemon requires a cluster token (ADR 0006)
}
