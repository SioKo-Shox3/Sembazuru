[package]
name = "sembazuru-worker"
description = "Remote worker: sandboxed process execution and local cache"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "sembazuru-worker"
path = "src/bin/sembazuru_worker.rs"

[dependencies]
sembazuru-proto = { path = "../proto" }
sembazuru-dataplane = { path = "../dataplane", features = ["tokio"] }
sembazuru-tracer = { path = "../tracer" }
tonic = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "net", "io-util"] }
tokio-stream = { version = "0.1", features = ["net"] }
