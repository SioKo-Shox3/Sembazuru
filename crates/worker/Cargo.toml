[package]
name = "sembazuru-worker"
description = "Remote worker: sandboxed process execution and local cache"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "sembazuru-worker"
path = "src/bin/sembazuru_worker.rs"

# Dev-only harness that co-locates the agent file server with the worker VFS
# pipe for the end-to-end redirect test. Uses agent as a dev-dependency, so it
# does not pull the agent into the worker's production dependencies.
[[example]]
name = "vfs_host"

# Dev driver that sends one VFS-mode Execute to a worker (M6.1b gate). Uses agent
# (dev-dep) for the Execute client and proto for the request types.
[[example]]
name = "exec_vfs"

[dev-dependencies]
sembazuru-agent = { path = "../agent" }

[dependencies]
futures-util = "0.3"
sembazuru-proto = { path = "../proto" }
sembazuru-dataplane = { path = "../dataplane", features = ["tokio"] }
sembazuru-tracer = { path = "../tracer" }
sembazuru-cas = { path = "../cas" }
sembazuru-config-store = { path = "../config-store" }
tonic = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "net", "io-util", "fs", "signal"] }
tokio-stream = { version = "0.1", features = ["net", "time"] }
# Graceful shutdown (M9.3c): the CLI's Ctrl-C and the service's SCM Stop both cancel
# a CancellationToken that folds the Execution server (mirrors the daemon).
tokio-util = "0.7"
# Persisted worker.toml config (M9.3c): a Windows Service has no per-shell env, so
# settings load from a TOML file (then SEMBAZURU_* override). Mirrors the daemon.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Job Objects for process-tree kill (M6.1e): killing the injected launcher must
# also kill its grandchild (the real compiler), which kill_on_drop cannot do.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dependencies]
# Windows Service support for `sembazuru-worker --service` (M9.3c). Windows-only;
# the worker's plain-CLI mode has no service dependency. Same version as the daemon.
windows-service = "0.7"
