[package]
name = "sembazuru-worker"
description = "Remote worker: sandboxed process execution and local cache"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "sembazuru-worker"
path = "src/bin/sembazuru_worker.rs"

# Dev-only harness that co-locates the agent file server with the worker VFS
# pipe for the end-to-end redirect test. Uses agent as a dev-dependency, so it
# does not pull the agent into the worker's production dependencies.
[[example]]
name = "vfs_host"

# Dev driver that sends one VFS-mode Execute to a worker (M6.1b gate). Uses agent
# (dev-dep) for the Execute client and proto for the request types.
[[example]]
name = "exec_vfs"

[dev-dependencies]
sembazuru-agent = { path = "../agent" }

[dependencies]
sembazuru-proto = { path = "../proto" }
sembazuru-dataplane = { path = "../dataplane", features = ["tokio"] }
sembazuru-tracer = { path = "../tracer" }
sembazuru-cas = { path = "../cas" }
tonic = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "net", "io-util", "fs"] }
tokio-stream = { version = "0.1", features = ["net", "time"] }
