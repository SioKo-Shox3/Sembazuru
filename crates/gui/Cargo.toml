[package]
name = "sembazuru-gui"
description = "Resident user-session GUI: cluster/cache dashboard and daemon controls (M9.4)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "sembazuru-gui"
path = "src/main.rs"

[dependencies]
sembazuru-proto = { path = "../proto" }
tonic = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
# Zeroize the cluster token's GUI-side copy on drop so the plaintext credential
# does not linger in freed heap memory (security review, M9.4a).
zeroize = "1"
# Immediate-mode GUI for the dashboard window (M9.4b, ADR 0008 §2). eframe brings
# its own egui; the glow (OpenGL) renderer is the default and the lightest on
# Windows. Tauri / native-tray were rejected in the ADR.
eframe = "0.34"
# Tray residency (M9.4c, ADR 0008 §2/§4): minimize-to-tray + a Show/Quit menu.
tray-icon = "0.24"

[target.'cfg(windows)'.dependencies]
# Single-instance guard (named mutex) for the resident GUI, and — in M9.4e — the
# ShellExecuteEx "runas" self-elevation for service start/stop. Same major as the
# worker's windows-sys. Windows-only.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

# The resident GUI's automated coverage stands up the *real* loopback Status
# service in-process (StatusState + serve_status_service, exactly as
# crates/agent/tests/status.rs does) and points the GUI's client at it. The agent
# is a dev-dependency only, so it never enters the GUI's production dependencies.
[dev-dependencies]
sembazuru-agent = { path = "../agent" }
