[package]
name = "sembazuru-gui"
description = "Resident user-session GUI: cluster/cache dashboard and daemon controls (M9.4)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "sembazuru-gui"
path = "src/main.rs"

[dependencies]
sembazuru-proto = { path = "../proto" }
tonic = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
# Zeroize the cluster token's GUI-side copy on drop so the plaintext credential
# does not linger in freed heap memory (security review, M9.4a).
zeroize = "1"
# Immediate-mode GUI for the dashboard window (M9.4b, ADR 0008 §2). eframe brings
# its own egui; the glow (OpenGL) renderer is the default and the lightest on
# Windows. Tauri / native-tray were rejected in the ADR.
eframe = "0.34"
# Tray residency (M9.4c, ADR 0008 §2/§4): minimize-to-tray + a Show/Quit menu.
tray-icon = "0.24"

[target.'cfg(windows)'.dependencies]
# Windows Service control (start/stop/query) for the local daemon and worker —
# same crate and version the daemon/worker register themselves with (M9.4e).
windows-service = "0.7"
# Single-instance guard (named mutex) and the ShellExecuteEx "runas" self-elevation
# that relaunches this exe to start/stop a service (M9.4c/e). Same major as the
# worker's windows-sys. Windows-only.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# Embeds an application manifest declaring requestedExecutionLevel=asInvoker so the
# resident GUI runs NON-elevated (ADR 0008 §4); only the per-action service control
# elevates, via a re-launch with the "runas" verb. Pure Rust (no mt.exe).
embed-manifest = "1"

# The resident GUI's automated coverage stands up the *real* loopback Status
# service in-process (StatusState + serve_status_service, exactly as
# crates/agent/tests/status.rs does) and points the GUI's client at it. The agent
# is a dev-dependency only, so it never enters the GUI's production dependencies.
[dev-dependencies]
sembazuru-agent = { path = "../agent" }
