[package]
name = "sembazuru-tracer"
description = "Reads Sembazuru binary traces and derives compiler dependency graphs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "sembazuru-trace"
path = "src/bin/sembazuru_trace.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
