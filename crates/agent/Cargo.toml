[package]
name = "sembazuru-agent"
description = "Local agent: VFS, scheduling, prefetch, and local fallback"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "sembazuru-agent"
path = "src/bin/sembazuru_agent.rs"

[dependencies]
sembazuru-proto = { path = "../proto" }
sembazuru-dataplane = { path = "../dataplane", features = ["tokio"] }
sembazuru-tracer = { path = "../tracer" }
sembazuru-cas = { path = "../cas" }
tonic = "0.14"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "net",
    "fs",
    "io-util",
    "sync",
] }

[dev-dependencies]
sembazuru-worker = { path = "../worker" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
