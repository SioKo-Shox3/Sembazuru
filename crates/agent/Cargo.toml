[package]
name = "sembazuru-agent"
description = "Local agent: VFS, scheduling, prefetch, and local fallback"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "sembazuru-agent"
path = "src/bin/sembazuru_agent.rs"

# The long-lived agent daemon (M6.0): Coordination + file server + Scheduler +
# LocalIntake in one process.
[[bin]]
name = "sembazuru-daemon"
path = "src/bin/sembazuru_daemon.rs"

# The compiler launcher (M6.0): invoked by the build system as
# `sembazuru <compiler> <args...>`; hands the action to the daemon over loopback.
[[bin]]
name = "sembazuru"
path = "src/bin/sembazuru_launcher.rs"

[dependencies]
sembazuru-proto = { path = "../proto" }
sembazuru-dataplane = { path = "../dataplane", features = ["tokio"] }
sembazuru-tracer = { path = "../tracer" }
sembazuru-cas = { path = "../cas" }
cap-std = "4"
tonic = "0.14"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "net",
    "fs",
    "io-util",
    "sync",
    "process",
    "signal",
] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# OS CSPRNG for unpredictable per-action session ids (ADR 0013 / PROTO-001): an
# attacker must *capture* a session id, not predict the next one. Tiny, no_std.
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
# Windows Service support for `sembazuru-daemon --service` (M9.3b). Windows-only;
# the daemon's plain-CLI mode has no service dependency.
windows-service = "0.7"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
sembazuru-worker = { path = "../worker" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
